[project]
name = "land-registry-web"
version = "0.1.0"
description = "Server-rendered front end for the land register lookup service"
requires-python = ">=3.12"
dependencies = [
    "email-validator==2.3.0",
    "flask==3.1.3",
    "flask-wtf==1.2.2",
    "govuk-frontend-jinja==4.1.0",
    "govuk-frontend-wtf==3.2.0",
    "gunicorn==26.2.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "beautifulsoup4==4.12.3",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The `app` package is not installed in the venv; without this pytest cannot find it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
