name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers uses the Docker already on the GitHub runner.
      - name: Run the tests
        working-directory: api
        run: ./mvnw --batch-mode verify

  web:
    name: Front-end (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Third-party action pinned to a commit: a tag can be moved to other
        # code, a commit cannot. setup-uv publishes no major tag (no "v10").
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: web
        run: uv sync --all-groups

      - name: Lint
        working-directory: web
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run the tests
        working-directory: web
        run: uv run pytest --cov=app --cov-report=term-missing
