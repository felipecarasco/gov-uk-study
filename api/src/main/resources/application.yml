spring:
  application:
    name: land-registry-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/land_registry
    username: land_registry
    password: land_registry
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # Spring Boot's console pattern reserves a slot for a correlation id; this
    # fills it with the request id from RequestIdFilter.
    correlation: "[%X{requestId:-}] "
